version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veryberry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veryberry}
      POSTGRES_DB: ${POSTGRES_DB:-veryberry}
    # SECURITY: DB port exposed only on localhost, not externally
    # Remove ports section entirely in production, use internal Docker network
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./uploads:/app/uploads
      - ./scripts:/app/scripts

volumes:
  db_data:

